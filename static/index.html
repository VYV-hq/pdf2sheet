<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF → Excel 변환기</title>
<style>
  :root { font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; }
  body { margin:0; background:#f4f6fb; color:#1c2333; }
  .wrap { max-width:760px; margin:40px auto; padding:0 16px; }
  h1 { font-size:26px; } .sub { color:#5a6478; margin-bottom:24px; }
  .card { background:#fff; border-radius:14px; padding:28px; box-shadow:0 2px 14px rgba(20,30,60,.08); }
  #drop { border:2px dashed #b9c3d8; border-radius:12px; padding:44px 20px; text-align:center;
          cursor:pointer; transition:.15s; }
  #drop.on { border-color:#3b6ef5; background:#eef3ff; }
  #drop b { color:#3b6ef5; }
  .row { display:flex; gap:16px; margin-top:16px; align-items:center; flex-wrap:wrap; }
  label { font-size:14px; color:#5a6478; }
  input[type=number] { width:70px; padding:6px 8px; border:1px solid #ccd4e4; border-radius:8px; }
  button { background:#3b6ef5; border:0; color:#fff; padding:11px 22px; border-radius:10px;
           font-size:15px; cursor:pointer; }
  button:disabled { background:#a9b7d8; cursor:default; }
  .bar { height:12px; background:#e6eaf3; border-radius:8px; overflow:hidden; margin-top:18px; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#3b6ef5,#7aa0ff);
           transition:width .4s; }
  #stat { margin-top:10px; font-size:14px; color:#39445e; white-space:pre-line; }
  .dl { margin-top:18px; display:none; gap:12px; }
  .dl a { display:inline-block; background:#12b76a; color:#fff; text-decoration:none;
          padding:11px 20px; border-radius:10px; margin-right:10px; }
  .dl a.csv { background:#667085; }
  .err { color:#d92d20; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PDF → Excel 변환기</h1>
  <div class="sub">스캔된 거래내역 PDF를 업로드하면 표를 인식해 하나의 엑셀 파일로 합칩니다.
    대용량 파일은 자동으로 n페이지씩 나눠 처리 후 병합됩니다.
    은행 형식(국민은행·IBK기업은행)은 자동 감지됩니다.
    <a href="/ibk" style="color:#3b6ef5;text-decoration:none">IBK기업은행 전용 페이지 →</a></div>
  <div class="card">
    <div id="drop">여기로 PDF를 끌어다 놓거나 <b>클릭해서 선택</b><br>
      <span id="fname" style="font-size:13px;color:#5a6478"></span></div>
    <input type="file" id="file" accept="application/pdf" hidden>
    <div class="row">
      <label>배치 크기(페이지) <input type="number" id="bs" value="20" min="1" max="200"></label>
      <label>동시 작업 수 <input type="number" id="wk" value="6" min="1" max="8"></label>
      <button id="go" disabled>변환 시작</button>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div id="stat">대기 중</div>
    <div class="dl" id="dl">
      <a id="axlsx" href="#">Excel(.xlsx) 다운로드</a>
      <a id="acsv" class="csv" href="#">CSV 다운로드</a>
    </div>
  </div>
</div>
<script>
const drop=document.getElementById('drop'), fileEl=document.getElementById('file'),
      go=document.getElementById('go'), stat=document.getElementById('stat'),
      fill=document.getElementById('fill'), dl=document.getElementById('dl');
let file=null, timer=null;

drop.onclick=()=>fileEl.click();
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on');}));
drop.addEventListener('drop',ev=>{ if(ev.dataTransfer.files.length) setFile(ev.dataTransfer.files[0]); });
fileEl.onchange=()=>{ if(fileEl.files.length) setFile(fileEl.files[0]); };

function setFile(f){
  if(!f.name.toLowerCase().endsWith('.pdf')){ stat.textContent='PDF 파일만 가능합니다'; return; }
  file=f; go.disabled=false;
  document.getElementById('fname').textContent=`${f.name} (${(f.size/1048576).toFixed(1)} MB)`;
}

go.onclick=async()=>{
  go.disabled=true; dl.style.display='none';
  stat.textContent='업로드 중... 0%';
  const bs=document.getElementById('bs').value, wk=document.getElementById('wk').value;
  const xhr=new XMLHttpRequest();
  xhr.open('POST',`/api/jobs?batch_size=${bs}&workers=${wk}`);
  xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
  xhr.upload.onprogress=e=>{ if(e.lengthComputable){
      const p=Math.round(e.loaded/e.total*100);
      stat.textContent=`업로드 중... ${p}%`; fill.style.width=(p*0.15)+'%'; }};
  xhr.onload=()=>{
    if(xhr.status!==200){ stat.innerHTML=`<span class="err">업로드 실패: ${xhr.responseText}</span>`; go.disabled=false; return; }
    const {job_id}=JSON.parse(xhr.responseText);
    stat.textContent='처리 시작...';
    timer=setInterval(()=>poll(job_id),2500);
  };
  xhr.onerror=()=>{ stat.innerHTML='<span class="err">네트워크 오류</span>'; go.disabled=false; };
  xhr.send(file);
};

async function poll(id){
  const r=await fetch(`/api/jobs/${id}`); if(!r.ok) return;
  const s=await r.json();
  if(s.state==='processing'||s.state==='merging'){
    const p=s.pages_total? s.pages_done/s.pages_total : 0;
    fill.style.width=(15+p*80)+'%';
    stat.textContent=`${s.state==='merging'?'병합/검증 중':'페이지 처리 중'}: `+
      `${s.pages_done||0}/${s.pages_total||'?'}페이지, 배치 ${s.batches_done||0}/${s.batches_total||'?'} (${s.elapsed_sec||0}초)`;
  } else if(s.state==='done'){
    clearInterval(timer); fill.style.width='100%'; go.disabled=false;
    stat.textContent=`완료: 거래 ${s.rows_total}건, 계좌 ${s.accounts}개, `+
      `잔액검증 통과 ${s.validation_rate}% (자동보정 ${s.repaired_cells}셀, ${s.elapsed_sec}초)`;
    document.getElementById('axlsx').href=`/api/jobs/${id}/download?fmt=xlsx`;
    document.getElementById('acsv').href=`/api/jobs/${id}/download?fmt=csv`;
    dl.style.display='block';
  } else if(s.state==='error'){
    clearInterval(timer); go.disabled=false;
    stat.innerHTML='<span class="err">처리 오류가 발생했습니다</span>';
  }
}
</script>
</body>
</html>
